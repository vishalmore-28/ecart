# Local test with an Oracle XE container:  docker compose -f docker-compose.oracle.yml --env-file .env up --build
# (needs ~3 GB RAM for Docker; first start takes 1-2 minutes)
services:
  db:
    image: gvenzl/oracle-xe:21-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_ROOT_PASS:-root-change-me}
      APP_USER: ecart
      APP_USER_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//db:1521/XEPDB1
      DB_USER: ecart
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecart.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "8080:8080"
volumes:
  oradata:
